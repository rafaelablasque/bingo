<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header></header>
    <main>
        <h1>
            Bingo de Natal
        </h1>
        <section class="conteudo"> 
            <div class="conteudo-sorteador">
                <h2>
                    Sorteador
                </h2>
                <div class="conteudo__numero_sorteado">
                    <p class="texto__numero_sorteado"></p>
                </div>
                <button onclick="sortear()" class="botao">
                    Sortear Número
                </button>
                <button onclick="reiniciar()" class="botao">
                    Reiniciar
                </button>
            </div>
            <div class="conteudo-exibicao">
                <h2>
                    Números Sorteados
                </h2>
            </div>
        </section>
    </main>
    <footer></footer>
    <script src="script.js"></script>
</body>
</html>
